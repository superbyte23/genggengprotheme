<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>NEVERMORE // Shadow Fiend</title>
<link rel="stylesheet" href="theme.css">
</head>
<body>
<header>
<div><a href="#"><img src="https://cdn.cloudflare.steamstatic.com/apps/dota2/images/dota_react/heroes/shadow_fiend.png" alt="SF"><span>NEVERMORE</span> SHADOW FIEND</a></div>
<nav>
<a href="#">Armory</a>
<a href="#">Souls</a>
<a href="#">Requiem</a>
<a href="#">Shrine</a>
<button>Demon Form</button>
</nav>
</header>
<main>
<div>
<div>Requiem of Souls — Configuration</div>
<div>
<div class="border">
<div class="box-title">Demon Profile</div>
<div class="box-content">
<img src="https://cdn.cloudflare.steamstatic.com/apps/dota2/videos/dota_react/heroes/renders/shadow_fiend.png" alt="Nevermore" style="width:100%;max-height:220px;object-fit:cover;object-position:top">
<hr>
<p>Collect souls. Unleash Requiem. Every kill fuels your shadow.</p>
<label class="label">Summoner Name</label>
<input class="input" placeholder="Enter your epithet...">
<div style="display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:10px">
<div><label class="label">Souls Collected</label><input type="number" value="36"></div>
<div><label class="label">Accent Flame</label><input type="color" value="#FF3B1F"></div>
</div>
</div>
</div>
<div class="border">
<div class="box-title">Necromastery</div>
<div class="box-content">
<div style="display:grid;grid-template-columns:1fr 1fr;gap:12px">
<div><label class="label">Razor Power</label><select><option>Shadowraze (Q)</option><option>Shadowraze (W)</option><option>Shadowraze (E)</option></select></div>
<div><label class="label">Presence Aura</label><select><option>Enabled</option><option>Suppressed</option></select></div>
</div>
<label class="label" style="margin-top:12px">Incantation</label>
<textarea placeholder="Speak your requiem...">I am the shadow that feeds on souls. Every light extinguished makes me stronger.</textarea>
<label style="display:flex;gap:8px;align-items:center;margin-top:10px;font-size:12px"><input type="checkbox" checked> Bind souls on death</label>
<label style="display:flex;gap:8px;align-items:center;margin-top:6px;font-size:12px"><input type="radio" name="pact" checked> Eternal Pact <input type="radio" name="pact"> Temporary Bargain</label>
<div style="display:flex;gap:8px;margin-top:14px;flex-wrap:wrap">
<button class="btn">Store Souls</button>
<button class="btn btn-danger">Release Requiem</button>
</div>
</div>
</div>
<div class="border">
<div class="box-title">Soul Shards — Inventory</div>
<div class="box-content">
<form class="grid" style="display:grid;grid-template-columns:1fr 1fr;gap:12px">
<div><label class="label">Shard Name</label><input placeholder="Ex: Soul of Anti-Mage"></div>
<div><label class="label">Origin</label><input placeholder="Dire / Radiant"></div>
<div class="col-span-2"><label class="label">Lore</label><input placeholder="How was it claimed?"></div>
<div class="col-span-2"><label class="label">Sigil Upload</label><input type="file"></div>
<div class="col-span-2" style="display:flex;gap:8px;margin-top:4px"><button class="btn" type="button">Capture Soul</button><button type="button">Cancel</button></div>
</form>
</div>
</div>
</div>
</div>
</main>
<footer>© 2026 Nevermore Shrine — Dota 2 Theme • Pure CSS Ember • <a href="https://animate.style" target="_blank">animate.style</a> • Souls: 36/40</footer>
</body>
</html>
