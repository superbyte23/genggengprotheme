<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Ember Only Test</title>
<style>
html,body{margin:0;padding:0;background:#07080B;min-height:100vh;overflow-x:hidden}
body::before{content:"";position:fixed;inset:0;z-index:-3;background:linear-gradient(180deg,#0E0A0A 0%,#07080B 100%)}
body::after{content:"";position:fixed;inset:-10%;z-index:30;background-image:radial-gradient(5px 5px at 12% 22%,rgba(255,80,30,0.96),transparent 68%),radial-gradient(4.5px 4.5px at 28% 58%,rgba(255,210,90,0.94),transparent 68%),radial-gradient(6px 6px at 55% 16%,rgba(255,45,45,0.90),transparent 68%),radial-gradient(4px 4px at 72% 44%,rgba(255,230,130,0.88),transparent 68%);background-size:380px 380px;opacity:0.85;pointer-events:none;filter:blur(0.7px) drop-shadow(0 0 6px rgba(255,80,30,0.7));animation:embers 13s linear infinite,emberTwinkle 2.8s ease-in-out infinite alternate;will-change:transform}
main::before{content:"";position:fixed;inset:-12%;z-index:29;background-image:radial-gradient(7px 7px at 22% 32%,rgba(255,60,30,0.55),transparent 72%),radial-gradient(6px 6px at 68% 62%,rgba(255,180,80,0.48),transparent 72%);background-size:520px 520px;opacity:0.62;pointer-events:none;filter:blur(1.2px);animation:embers2 19s linear infinite reverse}
@keyframes embers{0%{transform:translate3d(0,0,0) scale(1)}25%{transform:translate3d(18px,-115px,0) scale(1.06)}50%{transform:translate3d(-14px,-230px,0) scale(0.94)}75%{transform:translate3d(22px,-345px,0) scale(1.04)}100%{transform:translate3d(0,-520px,0) scale(1)}}
@keyframes embers2{0%{transform:translate3d(0,0,0)}30%{transform:translate3d(-22px,-140px,0)}60%{transform:translate3d(16px,-300px,0)}100%{transform:translate3d(-10px,-560px,0)}}
@keyframes emberTwinkle{0%{opacity:0.72}100%{opacity:1}}
div.test{position:relative;z-index:1;color:#E8E0C8;font-family:sans-serif;padding:40px;text-align:center;margin-top:40vh;background:rgba(20,20,30,0.85);border:1px solid #C9A86A;max-width:600px;margin-left:auto;margin-right:auto}
</style>
</head>
<body>
<main></main>
<div class="test">If you see TWO layers moving diagonally (bright small + larger blurry) — embers work. If only one moves, report which.</div>
</body>
</html>
